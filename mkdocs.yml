site_name: "Manual de Infra de Manuel"
site_description: Notas sobre ingeniería de cloud, plataforma e infraestructura, escritas mientras construyo puente.
site_author: Manuel Cardoza
repo_url: https://github.com/JCardzZ/infra-handbook
repo_name: JCardzZ/infra-handbook

# MkDocs excludes docs/templates/ by default; re-include it so the chapter template is published.
# docs/includes/ holds snippets (glossary) that are appended to pages, not published on their own.
exclude_docs: |
  !/templates/
  /includes/

theme:
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/study-path.js
  # Study viewer for architecture diagrams: zoom, pan, fit, 1:1.
  - javascripts/diagram-viewer.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - docs/includes/glossary.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

nav:
  - Inicio:
      - index.md
      - Acerca de: about.md
      - Plantilla de capítulo: templates/chapter-template.md
      - Guía de diagramas: diagrams-guide.md
  - Plan de estudio:
      - plan/index.md
      - "Fase 0 — Fundamentos": plan/fase-0.md
      - Proyectos: plan/proyectos.md
  - Fundamentos:
      - Linux: foundations/linux/index.md
      - Redes: foundations/networking/index.md
      - DNS y TLS: foundations/dns-tls/index.md
      - Contenedores: foundations/containers/index.md
      - Git: foundations/git/index.md
  - IaC:
      - Terraform: iac/terraform/index.md
  - Nube:
      - GCP: cloud/gcp/index.md
      - AWS: cloud/aws/index.md
      - Azure: cloud/azure/index.md
  - Kubernetes: kubernetes/index.md
  - CI/CD: cicd/index.md
  - Observabilidad: observability/index.md
  - Seguridad: security/index.md
  - FinOps: finops/index.md
  - Troubleshooting:
      - troubleshooting/index.md
      - "gcloud ADC: scope no consentido": troubleshooting/gcloud-adc-scope-not-consented.md
